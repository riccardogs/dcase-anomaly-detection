dev_directory: /disks/disk1/rsasu/ADDITIONAL_TRAINING
eval_directory: /disks/disk1/rsasu/EVALUATION
model_directory: ./model21
result_directory: ./result21
result_file: result_eval_v21.csv

max_fpr: 0.1

feature:
  n_mels: 128
  frames: 5
  n_fft: 1024
  hop_length: 512
  power: 2.0

fit:
  epochs: 50
  batch_size: 512
  shuffle: true
  validation_split: 0.1
  verbose: 1
  early_stopping_patience: 15
  reduce_lr_factor: 0.5
  reduce_lr_patience: 8
  min_lr: 1.0e-07

model:
  type: hybrid_v2
  bottleneck: 24
  dropout: 0.2
  l2_reg: 1.0e-5

augmentation:
  enabled: true
  noise_strength: 0.01
  mixup_alpha: 0.5
  augment_ratio: 0.25
